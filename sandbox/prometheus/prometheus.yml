global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: acme
    static_configs:
      - targets: ["checkout-api:8080"]
        labels: {service: checkout-api}
      - targets: ["payments-svc:8080"]
        labels: {service: payments-svc}
      - targets: ["inventory-svc:8080"]
        labels: {service: inventory-svc}
      - targets: ["card-gateway:8080"]
        labels: {service: card-gateway}
